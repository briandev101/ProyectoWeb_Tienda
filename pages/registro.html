<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../imagenes/icon.png" />
    <title>Registro</title>
    <link rel="stylesheet" href="../css/normalize.css">
</head>
<body>
    <main class="registro-principal">
        <section class="registro-informacion">
            <h1 class="informacion-titulo"><span>¡Bienvenido a Cer</span>, el lugar donde la ternura se viste de moda!</h1>
            <img src="../imagenes/icon.png" alt="Logo de Tienda Cer" class="informacion-logo" />
            <p class="informacion-texto-marca">CER STORE</p>
            <p class="informacion-texto-subtitulo">Kids Store</p>
        </section>

        <section class="registro-seccion-formulario">
            <h2 class="formulario-titulo">Crea Una Cuenta</h2>
            <form class="registro-formulario">
                <div class="formulario-grupo">
                    <label for="nombre" class="formulario-etiqueta">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required class="formulario-input" />
                </div>

                <div class="formulario-grupo">
                    <label for="apellido" class="formulario-etiqueta">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required class="formulario-input" />
                </div>

                <div class="formulario-grupo">
                    <label for="correo" class="formulario-etiqueta">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" required class="formulario-input" />
                </div>

                <div class="formulario-grupo">
                    <label for="contrasena" class="formulario-etiqueta">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" required class="formulario-input" />
                </div>

                <div class="formulario-grupo">
                    <label for="repetir-contrasena" class="formulario-etiqueta">Repita La Contraseña</label>
                    <input type="password" id="repetir-contrasena" name="repetirContrasena" required class="formulario-input" />
                </div>
                
                <button type="submit" class="boton-registro">Registrarse</button>
            </form>

            <p class="formulario-texto-enlace">
                ¿Ya tienes una cuenta? <a href="inicio-sesion.html" class="formulario-enlace">Inicia sesión</a>
            </p>
        </section>
    </main>
</body>
</html>
