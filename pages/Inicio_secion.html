<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../imagenes/icon.png" />
    <title>Inicio de Sesion</title>
    <link rel="stylesheet" href="../css/normalize.css">
</head>
<body>

    <main class="principal">
        <section class="informacion">
            <h1><span>¡Bienvenido a Cer</span>, el lugar donde la ternura se viste de moda!</h1>
            <img src="../imagenes/icon.png" alt="" />
            <link rel="stylesheet" href="../css/registo_acceso.css">

        </section>

        <section class="formulario-registro">
            <img src="/imagenes/registro_input_bg.png" alt="">
            <h2>Inicia Sesion</h2>
            <form class="formulario">
                <div class="campo-correo">
                    <label for="correo">Correo Electronico</label>
                    <input type="email" id="correo" name="correo" required />
                </div>

                <div class="campo-contrasena">
                    <label for="contrasena">Contrasena</label>
                    <input type="password" id="contrasena" name="contrasena" required />
                </div>

                <button type="submit">Iniciar Sesion</button>
            </form>
            <p>
                ¿No tienes una cuenta? <a href="registro.html">Regístrate</a>
            </p>
            <p>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </p>
        </section>
    </main>
</body>
</html>
