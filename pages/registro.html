<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../imagenes/icon.png" />
    <title>Registro</title>
</head>

<body>
    <div>
        <!-- Sección izquierda -->
        <div>
            <h1><span>¡Bienvenido a Cer</span>, el lugar donde la ternura se viste de moda!</h1>
            <img src="../imagenes/icon.png" alt="Logo Cer" />
            <p>CER STORE</p>
            <p>Kids Store</p>
        </div>

        <!-- Formulario de registro -->
        <div>
            <h2>Crea Una Cuenta</h2>
            <form>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required />

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" required />

                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" required />

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required />

                <label for="repetirContrasena">Repita La Contraseña</label>
                <input type="password" id="repetirContrasena" name="repetirContrasena" required />

                <button type="submit">Registrarse</button>
            </form>

            <p>¿Ya tienes una cuenta? <a href="#">Inicia sesión</a></p>
        </div>
    </div>
</body>

</html>
