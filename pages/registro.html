<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../imagenes/icon.png" />
    <title>Registro</title>

    <link rel="stylesheet" href="../css/registo_acceso.css">
</head>
<body>
    <main class="principal">
        <section class="informacion">
            <h1><span>¡Bienvenido a Cer</span>, el lugar donde la ternura se viste de moda!</h1>
            <img src="../imagenes/icon.png" alt="" />
        </section>

        <section class="formulario-registro">
            <img src="../imagenes/registro_input_bg.png" alt="";>
            <h2>Crea Una Cuenta</h2>
            <form class="formulario">
                <div class="campo-nombre">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required />
                </div>

                <div class="campo-apellido">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required />
                </div>

                <div class="campo-correo">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" required />
                </div>

                <div class="campo-contrasena">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" required />
                </div>

                <div class="campo-rep-contrasena">
                    <label for="repetir-contrasena">Repita La Contraseña</label>
                    <input type="password" id="repetir-contrasena" name="repetirContrasena" required />
                </div>
                
                <button type="submit">Registrarse</button>
            </form>

            <p>
                ¿Ya tienes una cuenta? <a href="inicio-sesion.html">Inicia sesión</a>
            </p>
        </section>
    </main>
</body>
</html>
