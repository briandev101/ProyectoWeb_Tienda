<!DOCTYPE html>
<html>
<head>
  <title>Manos Creadoras - Registro</title>
</head>
<body>

  <h1>Manos Creadoras</h1>

  <form action="registro" method="post">
    <p><strong>Crea tu cuenta</strong></p>

    Nombre y apellido:<br>
    <input type="text" name="nombre_apellido" placeholder="Introduzca su nombre y apellido"><br><br>

    Correo electrónico:<br>
    <input type="email" name="correo" placeholder="Introduce tu correo electrónico"><br><br>

    Contraseña:<br>
    <input type="password" name="contrasena" placeholder="Crea una Contraseña"><br><br>

    Repita la contraseña:<br>
    <input type="password" name="repetir_contrasena" placeholder="Crea una Contraseña"><br><br>

    <input type="checkbox" name="terminos"> He leído y acepto los términos y condiciones><br><br>

    <input type="submit" value="Registrarse">
    <input type="reset" value="Cancelar">
  </form>

</body>
</html>
